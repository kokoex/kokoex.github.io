<script>(function(){
var el=document.getElementById('wanan-search-input'),box=document.getElementById('wanan-search-results'),sum=document.getElementById('wanan-search-summary');
if(!el||!box)return;
var src=document.getElementById('wanan-search-index'),idx=[];
try{idx=JSON.parse(src&&src.textContent||'[]')}catch(e){idx=[]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function mark(s,qs){var t=String(s||''),low=t.toLowerCase(),hits=[];
for(var k=0;k<qs.length;k++){var q=qs[k];if(!q)continue;var i=0;while((i=low.indexOf(q,i))>=0){hits.push([i,i+q.length]);i+=q.length}}
hits.sort(function(a,b){return a[0]-b[0]});var merged=[],end=-1;
for(var h=0;h<hits.length;h++){if(hits[h][0]>=end){merged.push(hits[h]);end=hits[h][1]}}
var out='',cur=0;for(var m=0;m<merged.length;m++){out+=esc(t.slice(cur,merged[m][0]))+'<mark>'+esc(t.slice(merged[m][0],merged[m][1]))+'</mark>';cur=merged[m][1]}
return out+esc(t.slice(cur))}
function score(it,terms){var t=(it.t||'').toLowerCase(),k=(it.k||'').toLowerCase(),d=(it.d||'').toLowerCase(),s=0;
for(var i=0;i<terms.length;i++){var q=terms[i],hit=0;if(t.indexOf(q)>=0){s+=12;hit=1}if(k.indexOf(q)>=0){s+=4;hit=1}if(d.indexOf(q)>=0){s+=1;hit=1}if(!hit)return -1}
return s+(terms.length>1?6:0)}
function qp(){var s=location.search||'',i=s.indexOf('q=');if(i<0)return '';var v=s.slice(i+2).split('&')[0].split('+').join(' ');try{return decodeURIComponent(v)}catch(e){return v}}
function render(){var q=el.value.trim().toLowerCase(),terms=q?q.split(' ').filter(function(x){return !!x}):[];
var list=idx.map(function(it){return {it:it,s:terms.length?score(it,terms):1}}).filter(function(x){return x.s>0});
list.sort(function(a,b){if(a.s!==b.s)return b.s-a.s;return String(b.it.dt||'').localeCompare(String(a.it.dt||''))});
if(sum)sum.textContent=terms.length?('找到 '+list.length+' 条与「'+el.value.trim()+'」相关的内容'):('站内共收录 '+idx.length+' 条内容，输入关键词开始搜索');
if(!list.length){box.innerHTML='<div class="search-empty">'+(terms.length?'没有找到相关内容，换个关键词试试。':'输入关键词搜索文章、页面、相册与所有内容。')+'</div>';return}
box.innerHTML=list.slice(0,60).map(function(x){var it=x.it;
return '<a class="search-hit" href="'+esc(it.u)+'"><span class="search-type">'+esc(it.ty||'内容')+'</span><span class="search-hit-title">'+mark(it.t,terms)+'</span><span class="search-hit-desc">'+mark(it.d,terms)+'</span></a>'}).join('')}
el.value=qp();
el.addEventListener('input',function(){var q=el.value.trim();try{history.replaceState(null,'',location.pathname+(q?'?q='+encodeURIComponent(q):''))}catch(e){}render()});
var form=document.getElementById('wanan-search-form');
if(form)form.addEventListener('submit',function(e){e.preventDefault();render()});
el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var a=box.querySelector('.search-hit');if(a)location.href=a.getAttribute('href')}else if(e.key==='Escape'){el.value='';render()}});
render();el.focus()
})();</script></main>
