<script>(function(){var c={"mode":"auto","light":"minimal","dark":"noir","from":"19:00","to":"07:00"},h=document.documentElement,KEY='wanan-theme-override';
function mins(s){var p=String(s||'0:0').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)}
function night(){var d=new Date(),n=d.getHours()*60+d.getMinutes(),a=mins(c.from),b=mins(c.to);return a<=b?(n>=a&&n<b):(n>=a||n<b)}
function over(){try{var v=localStorage.getItem(KEY);return v==='light'||v==='dark'?v:null}catch(e){return null}}
function apply(m,persist){h.dataset.mode=m;h.dataset.theme=m==='dark'?c.dark:c.light;var b=document.getElementById('wanan-theme-toggle');if(b){b.textContent=m==='dark'?'\u2600':'\u263E';b.title=m==='dark'?'切换浅色':'切换深色';b.setAttribute('aria-label',b.title)}var f=document.querySelector('iframe.giscus-frame');if(f&&f.contentWindow){try{f.contentWindow.postMessage({giscus:{setConfig:{theme:m==='dark'?'dark':'light'}}},'https://giscus.app')}catch(e){}}if(persist){try{localStorage.setItem(KEY,m)}catch(e){}}}
function current(){var o=over();if(o)return o;if(c.mode==='light'||c.mode==='dark')return c.mode;return night()?'dark':'light'}
apply(current(),false);
document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('wanan-theme-toggle');if(b){var d=h.dataset.mode==='dark';b.textContent=d?'\u2600':'\u263E';b.title=d?'切换浅色':'切换深色';b.setAttribute('aria-label',b.title)}});
if(c.mode==='auto')setInterval(function(){if(over())return;var m=night()?'dark':'light';if(h.dataset.mode!==m)apply(m,false)},60000);
document.addEventListener('click',function(e){var t=e.target,b=t&&t.closest?t.closest('#wanan-theme-toggle'):null;if(!b)return;e.preventDefault();apply(h.dataset.mode==='dark'?'light':'dark',true)});
})();</script>
