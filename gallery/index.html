function show(i){if(i<0||i>=links.length)return;idx=i;var a=links[i];img.classList.add('is-loading');img.onload=img.onerror=function(){img.classList.remove('is-loading')};img.alt=a.getAttribute('data-title')||'';img.src=a.getAttribute('data-full')||'';var c=a.getAttribute('data-caption');cap.textContent=(a.getAttribute('data-title')||'')+(c?' · '+c:'');if(cnt)cnt.textContent=(i+1)+' / '+links.length;if(prev){prev.hidden=!nav;prev.disabled=!nav||links.length<2}if(next){next.hidden=!nav;next.disabled=!nav||links.length<2}}
function openAt(i){if(open)return;open=true;lock();box.classList.add('open');box.setAttribute('aria-hidden','false');show(i);var c=box.querySelector('[data-lb-close]');if(c&&c.focus)c.focus()}
function close(){if(!open)return;open=false;box.classList.remove('open');box.setAttribute('aria-hidden','true');img.removeAttribute('src');unlock()}
function step(d){if(!nav||links.length<2)return;var n=idx+d;if(n<0)n=links.length-1;if(n>=links.length)n=0;show(n)}
document.addEventListener('click',function(e){var t=e.target,a=t&&t.closest?t.closest('.photo-thumb[data-full]'):null;if(!a)return;e.preventDefault();e.stopPropagation();var i=links.indexOf(a);if(i>=0)openAt(i)},true);
box.addEventListener('click',function(e){var t=e.target,b=t&&t.closest?t.closest('[data-lb-close],[data-lb-prev],[data-lb-next]'):null;if(b){if(b.hasAttribute('data-lb-close'))close();else if(b.hasAttribute('data-lb-prev'))step(-1);else step(1);return}if(t===box)close()});
